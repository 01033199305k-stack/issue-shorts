# issue-shorts 채널 설정 - 군림보 레퍼런스, 커뮤니티 인기글, 소희 썰톤
engine: qwen            # qwen = qwen-tts 직접 실행(GitHub Actions) / voicebox = PC의 Voicebox 앱
voice: Sohee            # Qwen3-TTS CustomVoice 한국어 프리셋 (voicebox 엔진이면 프로필 ID)
instruct: "커뮤니티 썰 푸는 유튜버처럼, 어이없다는 듯 흥분해서 억양을 크게 오르내리며 빠르고 생동감 있게"
# 대본 세그먼트에 tone(문장별 연기 지시)이 있으면 "<tone> 말해. 전체적으로는 <instruct_persona>." 로 읽는다.
# 감정·속도 단어는 넣지 않는다 (tone 의 속삭임·체념과 부딪힌다). 말끝 잘림(Qwen3-TTS #55) 때문에 '말끝까지 또박또박'.
instruct_persona: "썰 푸는 유튜버가 친구한테 얘기하듯 억양을 살려 자연스럽게, 말끝까지 또박또박"
speed: 1.3              # 사용자 피드백(2026-10-04): 말이 너무 느림 -> 1.3배 (1.2배는 느리다고 함)
# 문장마다 몇 개를 생성해서 억양이 가장 살아 있는 것을 고를지 (2026-10-17, 10/13 B안). 1이면 예전처럼 첫 통과 take.
# 러너 CPU에서 문장당 약 35초 x 개수 - 3이면 렌더가 영상당 약 20분. 긴급 회차는 run.py 가 1로 돌린다.
tts_takes: 3

# 공개 시각표 (KST). 대본 파일 이름이 scripts/<날짜>-<HHMM>.json, 예: 2026-10-04-0700.json
# 늘리거나 줄이려면 이 목록만 고친다 (대본 담당 예약 작업·감시도 이 목록을 읽는다)
slots: ["07:00", "12:00", "18:00"]   # 2026-10-15~ 하루 3편 (사용자 결정: 4편 늘린 10/13~14 중앙값 1.4천으로 하락, 21시 슬롯이 가장 약함); 10/13~10/14 4편, 10/8~10/12 3편, 10/5~10/7 4편

# 카드: 제목띠(0~535px)는 고정, 패널만 천천히 확대/축소
zoom_target: 1.06
pin_top: 535

# 자막: 2026-10-08 도롱차처럼 최대 두 줄(78px 도현체, 반투명 회색 상자를 그림 아랫부분에 얹음),
# 문장의 cap 값으로 색이 바뀐다 (motion.py CSS #cap). 2026-10-06엔 한 줄 62px였는데 레퍼런스보다 1.5배 작았다
fontsize: 74
caption_words: 7
caption_line_chars: 12     # 한글 12자 폭 단위(숫자·영문·공백은 좁게 셈, motion._cw). 2026-10-22: 상자가 x 980(좋아요·댓글 버튼) 안에 들게
caption_lines: 2

# 좋아요 이스터에그 (2026-10-17 사용자): 유튜브는 영상 주제를 자동 분류해 좋아요 버튼을 주제 아이콘으로 바꾼다.
# 대본의 like_egg 가 eggs 에 있으면 렌더러가 마지막에 한 문장을 붙여 읽는다:
# "좋아요 누르면 좋아요가 강아지 발바닥으로 변해요~" (자막 분홍 + 하트→발바닥 그림, motion.EGGS / egg_segment).
# eggs 는 보도된 주제 전부(2026-10-17 사용자: "보도 기준으로 적용"). dog·cat·car 는 쇼츠에서 변신 확인(사용자 폰, dog 는 우리 10/10 개 간식 편).
# 우리 영상에서 안 변하는 게 확인된 주제는 여기서 빼면 그 뒤로 안 붙는다.
# food 는 뺌 (2026-10-22 사용자: 10/18 떡볶이·10/20 케이크·10/21 미역국 편에서 눌러도 안 변함).
# 2026-10-26 사용자: "안 바뀌니까 거슬려" - 전부 끔. 다시 켜지 말 것.
like_cta: {enabled: false, eggs: [dog, cat, car, learning, music, travel, comedy, horror, soccer, baseball, basketball]}

bgm: assets/bgm/sneaking_around.mp3   # OpenGameArt CC0
bgm_gain_db: -10                      # 배경음악 크기 (클수록 큼, -16 이면 말소리에 묻혀 거의 안 들림)
sfx_dir: assets/sfx                   # 비공개 저장소(issue-shorts-assets)에서 받아 온다
transition_sfx: whoosh

brand:
  accent: "#FFE14D"
  ink: "#000000"

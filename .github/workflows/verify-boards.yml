# 임시 점검 (병합 전 삭제): 새 게시판 파서와 gather 를 러너에서 실제로 돌려 본다. 커밋은 하지 않는다.
name: verify-boards
on:
  push:
    branches: ["claude/more-boards"]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: boards
        shell: python
        run: |
          import sys, re; sys.path.insert(0, "."); import collections, scrape
          posts, warns = scrape.collect()
          print("WARN", warns)
          by = collections.defaultdict(list)
          for p in posts: by[p["board"]].append(p)
          for b, rows in by.items():
              top = sorted(rows, key=lambda r: -r["comments"])
              bodies = [scrape.post_body(r["url"]) for r in top[:3]]
              print(f"{b}: {len(rows)} rows | bodies chars {[len(x['text']) for x in bodies]} links {[len(x['links']) for x in bodies]}")
              for r in top[:2]:
                  print("   ", r["comments"], r["title"][:40], r["url"])
      - name: gather
        run: |
          python gather.py
          python - <<'PY'
          import json, collections
          d = json.load(open('inbox/latest.json'))
          print('boards in top 40:', collections.Counter(p['board'] for p in d['posts']))
          print('with news links:', sum(1 for p in d['posts'] if p.get('news')), '| in_news:', sum(1 for p in d['posts'] if p.get('in_news')))
          print('news_hot', len(d['news_hot']))
          PY

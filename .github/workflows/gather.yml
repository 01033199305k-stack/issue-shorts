# 커뮤니티 인기글 수집 → inbox/latest.json.
# 대본을 쓰는 클라우드 예약 작업(3시간마다)은 시작할 때 이 워크플로를 직접 돌린다. 그 작업은 커뮤니티 사이트에 직접 접속하지 못해서(보안 프록시)
# 접속이 되는 Actions 러너가 미리 모아 둔다.
# 30분마다도 돈다: 지금 막 터진 화제(은행 해킹 [속보] 같은)가 보이면 urgent.py 가 inbox/urgent.json 을 쓰고,
# 아래 마지막 단계가 긴급 대본 루틴(ROUTINE_URGENT.md)을 깨운다 → 영상이 나오면 3분 뒤 공개.
name: gather

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (정각은 GitHub 예약 실행이 몰려서 늦는다)
  workflow_dispatch:
    inputs:
      ping:
        description: "긴급 루틴 연결 시험: 후보가 없어도 루틴을 한 번 깨운다 (루틴은 확인만 하고 아무것도 푸시하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gather.py
      - name: 저장
        run: |
          git config user.name "issue-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add inbox
          git diff --cached --quiet && exit 0
          git commit -q -m "inbox: $(TZ=Asia/Seoul date +'%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      # 긴급 소재를 새로 잡았으면(urgent.json 이 이번에 바뀜) 긴급 대본 루틴을 깨운다.
      # URGENT_HOOK_URL·URGENT_HOOK_TOKEN: 루틴 'issue-shorts 긴급 대본 (API 호출)'의 API 트리거 주소·토큰 (없으면 경고만 하고 건너뜀)
      # 수동 실행에서 ping 을 켜면 후보가 없어도 한 번 깨워서 연결을 시험한다.
      - name: 긴급 대본 루틴 깨우기
        env:
          HOOK_URL: ${{ secrets.URGENT_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.URGENT_HOOK_TOKEN }}
          PING: ${{ inputs.ping }}
        run: |
          if [ -f .urgent_fired ]; then
            body=$(python3 -c "import json; c=json.load(open('inbox/urgent.json'))['candidates']; print(json.dumps({'text': '긴급 소재 감지: ' + ' / '.join(x['title'] for x in c)[:300] + ' - ROUTINE_URGENT.md 대로 처리'}, ensure_ascii=False))")
          elif [ "$PING" = "true" ]; then
            body='{"text": "연결 시험 호출 (gather 수동 실행 ping). 지금 새 긴급 후보는 없음."}'
          else
            echo "새 긴급 소재 없음"; exit 0
          fi
          if [ -z "$HOOK_URL" ] || [ -z "$HOOK_TOKEN" ]; then echo "::warning::URGENT_HOOK_URL·URGENT_HOOK_TOKEN 시크릿이 없어 긴급 루틴을 깨우지 못함"; exit 0; fi
          headers=(-H "Authorization: Bearer $HOOK_TOKEN" -H "anthropic-version: 2023-06-01"
                   -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "Content-Type: application/json")
          code=$(printf '%s' "$body" | curl -s -o /tmp/hook.txt -w '%{http_code}' -X POST "$HOOK_URL" "${headers[@]}" --data-binary @- || true)
          echo "루틴 호출 $code: $(head -c 300 /tmp/hook.txt)"
          case "$code" in 2*) ;; *) echo "::error::긴급 루틴 호출 실패 $code"; exit 1;; esac

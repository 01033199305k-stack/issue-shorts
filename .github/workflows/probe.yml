# 일회성 점검: 열리는 사이트의 목록 HTML 구조 확인 (사이트마다 요청 1번, 목록 앞부분만 로그에 출력)
name: probe-sites
on:
  push:
    branches: ["claude/probe-sites"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe
        shell: python
        run: |
          import re, time, urllib.request
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0 Safari/537.36")
          SITES = [
            ("ruliweb", "https://bbs.ruliweb.com/best/all", "table_body", 2),
            ("pann", "https://pann.nate.com/talk/ranking", "post_wrap", 1),
            ("bobae", "https://www.bobaedream.co.kr/list?code=best", "bsubject", 2),
            ("mlbpark", "https://mlbpark.donga.com/mp/b.php?b=bullpen", "replycnt", 3),
            ("naver", "https://news.naver.com/main/ranking/popularMemo.naver", "rankingnews_box", 1),
            ("instiz", "https://www.instiz.net/pt", "listsubject", 2),
          ]
          for name, url, marker, nth in SITES:
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "ko-KR,ko;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read(1_500_000)
                      ctype = r.headers.get("Content-Type", "")
              except Exception as e:
                  print(f"##### {name}: {e}"); continue
              enc = "cp949" if re.search(rb'charset=["\']?(euc-kr|ks_c)', raw[:3000], re.I) or "euc-kr" in ctype.lower() else "utf-8"
              h = raw.decode(enc, errors="replace")
              idx = -1
              for _ in range(nth):
                  idx = h.find(marker, idx + 1)
              print(f"##### {name} enc={enc} ctype={ctype} len={len(h)} at={idx}")
              if idx >= 0:
                  seg = h[max(0, idx - 400): idx + 3200]
                  seg = re.sub(r"<script.*?</script>|<style.*?</style>|<svg.*?</svg>", "", seg, flags=re.S)
                  seg = re.sub(r"\s+", " ", seg)
                  for i in range(0, len(seg), 300):
                      print(seg[i:i + 300])
              time.sleep(1)

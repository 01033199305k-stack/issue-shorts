# 감시: 회차마다 대본과 영상이 제때 나왔는지 본다. 없으면 실패 → GitHub 가 메일로 알린다.
# 대본은 3시간마다 클라우드 예약 작업이, 영상은 그 푸시로 produce 가 만든다 (영상 하나 10~20분).
# 공개 40분 전인데 영상 기록이 없는 회차, 지난 3시간 동안 빠진 회차를 찾는다.
name: watchdog

on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다 (정각은 GitHub 예약 실행이 몰려서 늦는다)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 회차 점검
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, re, sys
          KST = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(KST)
          cfg = open("config.yaml", encoding="utf-8").read()
          slots = re.findall(r'"(\d{2}:\d{2})"', cfg[cfg.index("slots:"):cfg.index("]", cfg.index("slots:"))])
          hist = {r["key"]: r for r in json.load(open("state/history.json"))}
          missing = []
          for day in (now.date() - dt.timedelta(days=1), now.date()):
              for s in slots:
                  at = dt.datetime.combine(day, dt.time(*map(int, s.split(":"))), KST)
                  if not (now - dt.timedelta(hours=3) <= at <= now + dt.timedelta(minutes=40)):
                      continue
                  key = f"{day}-{s.replace(':', '')}"
                  r = hist.get(key)
                  if r and (r.get("video_id") or r.get("skipped")):
                      print("ok  ", key, "건너뜀: " + r["skipped"] if r.get("skipped") else r.get("url"))
                  else:
                      why = "영상 기록 없음 (produce 실행 확인)" if os.path.exists(f"scripts/{key}.json") else "대본 없음 (클라우드 예약 작업 확인)"
                      missing.append(f"{key}: {why}")
          for m in missing:
              print(f"::error::{m}")
          sys.exit(1 if missing else 0)
          PY

# 대본 → 영상 → 유튜브 예약 공개.
# 대본은 Claude 구독으로 도는 클라우드 예약 작업(ROUTINE.md)이 04:00·14:00 KST 에 scripts/ 로 푸시한다.
# 그 푸시가 이 워크플로를 깨운다. 영상은 07:30·17:00 KST 예약 공개로 올라가고, 그 사이가 검수 시간이다
# (유튜브 스튜디오 앱 → 예약됨 → 미리 보고 문제 있으면 삭제).
name: produce

on:
  push:
    branches: [main, "claude/**"]
    paths: ["scripts/*.json"]
  workflow_dispatch:
    inputs:
      script:
        description: "대본 JSON 경로 (예: examples/taiwan-taxi.json, scripts/2026-10-02-morning.json)"
        required: true
        default: examples/taiwan-taxi.json
      slot:
        description: "morning(07:30) / evening(17:00) / auto(파일 이름 또는 시계 기준)"
        default: auto
      dry_run:
        description: "업로드 없이 영상만 만들기 (결과물은 Artifacts에서 받기)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 - 글꼴·패키지 검증을 마친 24.04 로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 대본 찾기
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_SCRIPT: ${{ inputs.script }}
        run: |
          if [ -n "$INPUT_SCRIPT" ]; then
            files="$INPUT_SCRIPT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'scripts/*.json')
          else
            files=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD -- 'scripts/*.json')
          fi
          echo "대본: $files"
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"

      - name: 효과음 받기 (비공개 저장소)
        if: steps.find.outputs.files != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/issue-shorts-assets
          ssh-key: ${{ secrets.ASSETS_DEPLOY_KEY }}
          path: _assets
      - if: steps.find.outputs.files != ''
        run: mkdir -p assets/sfx && cp _assets/sfx/*.wav assets/sfx/

      - name: 시스템 패키지 (ffmpeg, 이모지·한글 글꼴)
        if: steps.find.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sox fonts-noto-color-emoji fonts-noto-cjk >/dev/null

      - uses: actions/setup-python@v5
        if: steps.find.outputs.files != ''
        with:
          python-version: "3.12"
          cache: pip

      # torch·torchaudio 는 CPU 빌드 짝으로 먼저 깐다. PyPI 의 리눅스 torchaudio 는 CUDA 빌드라
      # GPU 없는 러너에서 libcudart 를 못 찾아 죽는다 (2026-10-01 첫 실행). 뒤 설치가 이 둘을 바꾸지 못하게 고정
      - name: 파이썬 패키지
        if: steps.find.outputs.files != ''
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -iE '^(torch|torchaudio)==' > /tmp/torch-cpu.txt
          pip install -q -r requirements.txt -c /tmp/torch-cpu.txt
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__)"

      # 음성 모델(Qwen3-TTS 1.7B, 약 3.5GB)과 자막 타이밍용 whisper small
      - name: 모델 캐시
        if: steps.find.outputs.files != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3tts-1.7b-customvoice-whisper-small-v1

      - name: 영상 제작·예약 업로드
        if: steps.find.outputs.files != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"
          FILES: ${{ steps.find.outputs.files }}
          SLOT: ${{ inputs.slot || 'auto' }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          for f in $FILES; do
            echo "=== $f"
            python run.py --script "$f" --slot "$SLOT" $DRY
          done

      - name: 기록 저장 (main)
        if: always() && steps.find.outputs.files != ''
        run: |
          git config user.name "issue-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -q -m "state: $(date -u +%FT%TZ)"
          # 클라우드 작업이 claude/** 브랜치에 올렸어도 대본·기록이 main 에 남게 main 위로 올린다
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: 결과물 보관 (7일)
        if: always() && steps.find.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/script.json
            output/*/record.json
            output/*/cards/*.png
          retention-days: 7
          if-no-files-found: ignore
